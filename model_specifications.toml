# Reference instantiation of the Intelligence Density framework.
# Run: python calculate_ID.py model_specifications.toml
#
# The values below are illustrative proxy estimates — rough placeholders
# intended to demonstrate the formula structure. They are NOT authoritative
# measurements, and their specific operationalization (what data or methodology
# should legitimately fill each slot) is separate work, deliberately left open
# by the framework. Substitute your own rigorously derived values for any
# serious application.
#
# Rules:
#   - All 'value' fields must be in [0, 1] (normalized).
#   - For intelligence components: higher value = more of the named capability.
#   - For resource components: higher value = greater resource consumption.
#   - Weights do not need to sum to 1.0 — the script auto-normalizes them.

[IntelligenceComponents]
performance                = { value = 0.9,  weight = 0.25 }
generalization             = { value = 0.8,  weight = 0.20 }
learning_efficiency        = { value = 0.7,  weight = 0.15 }
interpretability           = { value = 0.6,  weight = 0.10 }
robustness                 = { value = 0.75, weight = 0.15 }
transfer_learning          = { value = 0.85, weight = 0.10 }
creativity_problem_solving = { value = 0.7,  weight = 0.05 }

[ResourceComponents]
model_size             = { value = 0.5,  weight = 0.30 }
computational_complexity = { value = 0.6, weight = 0.25 }
energy_consumption     = { value = 0.7,  weight = 0.20 }
inference_time         = { value = 0.4,  weight = 0.10 }
hardware_utilization   = { value = 0.65, weight = 0.10 }
development_time       = { value = 0.8,  weight = 0.05 }
